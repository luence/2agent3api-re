name: build

# 构建 Windows 桌面端安装包并自动挂载到 GitHub Release 上。
#
# ── 触发方式 ──────────────────────────────────────────────────
#   · 推送 v* tag（如 v5）：自动触发 Windows 编译并发布 Release
#   · 手动 workflow_dispatch（在 Actions 页面选分支触发）：手动触发构建与发布
#
# ── 构建目标 ──────────────────────────────────────────────────
#   · 仅构建 Windows 客户端（NSIS 原地覆盖更新安装包 + 绿色版可执行程序）

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  RUST_BACKTRACE: 1

jobs:
  # ── Windows ─────────────────────────────────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop-tauri/package-lock.json

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri -> ../../target

      - name: 安装桌面端依赖
        run: npm --prefix desktop-tauri ci

      - name: 构建 Windows 安装包
        run: npm --prefix desktop-tauri run build

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: windows-nsis
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: 发布 Windows 产物到 GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v5' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Agent2API v5 自动构建版' }}
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            target/release/bundle/nsis/*.exe
            target/release/agent2api.exe
            target/release/workbuddy-proxy-desktop.exe
          body: |
            ## 🚀 Agent2API v5 自动构建发布

            ### 🌟 本次核心更新
            - **同步上游 3.0.7 核心特性**：
              - 修复：国际版对话请求按官方 5.8.4 客户端对齐身份与会话头族，通过上游新增渠道校验（11-128 拦截不再出现）；
              - 修复：OrcaTerm 选中上游未挂载模型（如 Hy4-preview）时明确报错，不再静默回落或返回空白回答；
              - 更新：OrcaTerm 模型清单对齐桌面端面板，新增 Hy4-preview、Hy3、DeepSeek-V4.1-Flash；
              - 更新：AutoClaw 签到的「活动福利已到账」确认现在涵盖新手期 7 天登录奖励；
              - 更新：手动关闭订阅内核后，测试 / 保存账号引用 / 订阅同步不再悄悄拉起内核，改为提示先点「启动内核」；
              - 更新：添加账号弹窗的「自定义」段不再重复显示预置模板建的家，加账号入口统一到预置卡片；
              - 增加：支持直接读取并导入本机官方桌面客户端（Windows/macOS）登录态。
            - **长度截断自动续写与伪换行过滤 GUI**：
              - 设置页新增「长度截断自动续写」开关与上限轮数配置，并内置详尽优缺点对比卡片；
              - 设置页新增「丢弃保活换行心跳分片」开关，彻底解决 WorkBuddy / AutoClaw 流式输出换行碎片导致的排版崩溃；
              - 接入多语言国际化翻译管道。
            - **提示词文件导入与正文联动系统**：
              - 设置页「提示词文件」与各提供商配置行提供「导入文件…」/「导入…」按钮；
              - 选定后自动记录文件绝对路径，并直接将文件 UTF-8 文本内容写入生效的「提示词正文」。
            - **新增支持 CodeBuddy (国内版)**：
              - 完整适配腾讯 CodeBuddy 官方网页一键扫码/短信登录态获取；
              - 支持手动填写 `accessToken`，内置 JWT 自动解码与用户身份自动提取。
            - **安装程序智能原地就地覆盖更新**：
              - NSIS 安装包自动扫描本机注册表与既有路径，自动识别已安装目录；
              - 安装目录自动预填已有路径，一步直接覆盖更新老版本文件。
            - **软件标题与版本递增标识**：
              - 软件标题（`Agent2API v5 · 多提供商本地网关`）、任务栏图标、侧边栏 Logo 旁均显式展示 `v5` 标记。

            ### 📦 文件清单
            - `Agent2API v5_*.exe`：Windows 64位 NSIS 安装包（推荐，自动识别并原地覆盖）
            - `agent2api.exe`：免安装绿色版可执行程序
